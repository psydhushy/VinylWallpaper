[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas2we"
version = "0.1.0"
description = "Turn a Spotify Canvas (animated track background) into a Wallpaper Engine wallpaper"
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "playwright>=1.40", "streamlit>=1.40", "segno>=1.5"]

[project.scripts]
canvas2we = "canvas2we.cli:main"

[tool.setuptools]
packages = ["canvas2we"]

[tool.setuptools.package-data]
canvas2we = ["static/*"]
